[platformio]
default_envs = uno, esp32
src_dir = .

[env:uno]
platform = atmelavr
board = uno
upload_port = /dev/cu.usbmodem*
framework = arduino
build_src_filter = +<arduino_uno/arduino_uno.cpp>
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = esp32dev
upload_port = /dev/cu.usbserial-*
framework = arduino
build_src_filter = +<esp32_gateway/esp32_gateway.cpp>
monitor_speed = 115200
